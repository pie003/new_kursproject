<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Личный кабинет — Сервис «Почему я не сдал вовремя»</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .user-info h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        .user-info p {
            font-size: 14px;
            opacity: 0.9;
        }
        .logout-btn {
            background: rgba(255,255,255,0.2);
            padding: 8px 15px;
            border-radius: 20px;
            color: white;
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
        }
        .logout-btn:hover {
            background: rgba(255,255,255,0.3);
        }
        .dashboard-nav {
            display: flex;
            gap: 15px;
            background: #f8f9fa;
            padding: 15px 30px;
            border-bottom: 1px solid #e0e0e0;
            flex-wrap: wrap;
        }
        .nav-link {
            padding: 8px 20px;
            background: #e9ecef;
            border-radius: 25px;
            text-decoration: none;
            color: #333;
            font-weight: 500;
            transition: 0.3s;
        }
        .nav-link:hover {
            background: #667eea;
            color: white;
        }
        .main-content {
            padding: 30px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: linear-gradient(135deg, #f0f4ff 0%, #e9edf5 100%);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }
        .stat-card h3 {
            font-size: 32px;
            color: #667eea;
            margin-bottom: 5px;
        }
        .profile-details {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
        }
        .profile-details h3 {
            margin-bottom: 15px;
            color: #333;
        }
        .profile-details p {
            margin: 8px 0;
            font-size: 15px;
        }
        .error-message {
            background: #fed7d7;
            color: #c53030;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #c53030;
        }
        @media (max-width: 650px) {
            .header {
                flex-direction: column;
                text-align: center;
            }
            .dashboard-nav {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="user-info">
            <h1>👋 Добро пожаловать, <span th:text="${userFirstName}"></span> <span th:text="${userLastName}"></span></h1>
            <p>Группа <span th:text="${userGroup}"></span> • Последний вход: <span th:text="${lastLogin}"></span></p>
        </div>
        <a href="/logout" class="logout-btn">🚪 Выйти</a>
    </div>

    <div class="dashboard-nav">
        <a href="/new-excuse" class="nav-link">➕ Новое объяснение</a>
        <a href="/drafts" class="nav-link">📋 Черновики</a>
        <a href="/saved" class="nav-link">⭐ Сохранённые</a>
        <a href="/edit-profile" class="nav-link">⚙️ Редактирование профиля</a>
    </div>

    <div class="main-content">
        <div th:if="${error}" class="error-message" th:text="${error}"></div>

        <div class="stats">
            <div class="stat-card">
                <h3 th:text="${totalRequests}">0</h3>
                <p>Всего запросов</p>
            </div>
            <div class="stat-card">
                <h3 th:text="${savedCount}">0</h3>
                <p>Сохранённых</p>
            </div>
        </div>

        <div class="profile-details">
            <h3>👤 Ваши данные</h3>
            <p><strong>Имя:</strong> <span th:text="${userFirstName}"></span></p>
            <p><strong>Фамилия:</strong> <span th:text="${userLastName}"></span></p>
            <p><strong>Группа:</strong> <span th:text="${userGroup}"></span></p>
            <p><strong>Пол:</strong>
                <span th:if="${userGender == 'MALE'}">Мужской</span>
                <span th:if="${userGender == 'FEMALE'}">Женский</span>
                <span th:if="${userGender == 'OTHER'}">Другой</span>
                <span th:unless="${userGender}">Не указан</span>
            </p>
            <p><strong>Email:</strong> <span th:text="${userEmail}"></span></p>
        </div>
    </div>
</div>
</body>
</html>
