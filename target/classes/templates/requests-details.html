<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Мои запросы</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
        }
        .filter-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            align-items: center;
        }
        .filter-bar form {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        .filter-bar select, .filter-bar input {
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }
        .request-card {
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            transition: 0.2s;
        }
        .request-card:hover {
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .request-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .request-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            color: white;
        }
        .status-generated { background: #f59e0b; }
        .status-saved { background: #48bb78; }
        .status-completed { background: #667eea; }
        .star { color: gold; font-size: 20px; }
        .no-star { color: #ccc; }
        .request-preview {
            color: #555;
            margin: 10px 0;
        }
        .request-meta {
            font-size: 12px;
            color: #888;
            display: flex;
            gap: 20px;
        }
        .btn-details {
            background: #667eea;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #667eea;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="container">
    <a href="/dashboard" class="back-link">← Назад в кабинет</a>
    <h1>📋 Мои запросы</h1>

    <div class="filter-bar">
        <form method="get" action="/requests">
            <select name="status" multiple size="3" style="height: auto;">
                <option value="generated" th:selected="${#lists.contains(selectedStatuses, 'generated')}">Сгенерированные</option>
                <option value="saved" th:selected="${#lists.contains(selectedStatuses, 'saved')}">Сохранённые</option>
                <option value="completed" th:selected="${#lists.contains(selectedStatuses, 'completed')}">Завершённые</option>
            </select>
            <input type="text" name="search" placeholder="Поиск..." th:value="${search}">
            <button type="submit">Применить</button>
            <a href="/requests">Сбросить</a>
        </form>
    </div>

    <div th:if="${#lists.isEmpty(requests)}">
        <p>Запросы не найдены.</p>
    </div>
    <div th:each="req : ${requests}" class="request-card">
        <div class="request-header">
            <div>
                <span th:if="${req.status.code == 'saved'}" class="star">⭐</span>
                <span th:unless="${req.status.code == 'saved'}" class="no-star">☆</span>
                <strong> Запрос от <span th:text="${#temporals.format(req.createdAt, 'dd.MM.yyyy HH:mm')}"></span></strong>
            </div>
            <div>
                <span class="request-status" th:classappend="'status-' + ${req.status.code}" th:text="${req.status.displayName}"></span>
            </div>
        </div>
        <div class="request-preview" th:text="${req.params != null ? req.params.eventDescription : 'Нет описания'}"></div>
        <div class="request-meta">
            <span>👨‍🏫 <span th:text="${req.params != null ? req.params.recipient : '—'}"></span></span>
            <span>📅 <span th:text="${#temporals.format(req.updatedAt, 'dd.MM.yyyy')}"></span></span>
        </div>
        <div style="margin-top: 12px;">
            <form th:action="@{/request/{id}(id=${req.id})}" method="get" style="display:inline">
                <button type="submit" class="btn-details">📄 Детали</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
