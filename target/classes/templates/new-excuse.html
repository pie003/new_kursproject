<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Новое объяснение — Сервис «Почему я не сдал вовремя»</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px 30px;
            position: relative;
        }
        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
        .back-link {
            position: absolute;
            top: 25px;
            right: 30px;
            color: white;
            text-decoration: none;
            background: rgba(255,255,255,0.2);
            padding: 8px 15px;
            border-radius: 20px;
            transition: 0.3s;
        }
        .back-link:hover {
            background: rgba(255,255,255,0.3);
        }
        .main-content {
            padding: 30px;
        }
        .two-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        .params-form {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
        }
        .params-form h3 {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
            font-size: 14px;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .checkbox-group input {
            width: auto;
        }
        .generate-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }
        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }
        .result-section {
            background: #f0f4ff;
            padding: 25px;
            border-radius: 15px;
        }
        .result-section h3 {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .generated-text {
            background: white;
            padding: 20px;
            border-radius: 10px;
            min-height: 400px;
            border-left: 4px solid #667eea;
            line-height: 1.6;
            white-space: pre-wrap;
            font-size: 15px;
        }
        .placeholder {
            color: #999;
            text-align: center;
            padding: 60px 20px;
        }
        .action-buttons {
            margin-top: 20px;
            text-align: center;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-save, .btn-complete, .btn-copy {
            padding: 8px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: 0.2s;
        }
        .btn-save {
            background: #48bb78;
            color: white;
        }
        .btn-save:hover {
            background: #38a169;
        }
        .btn-complete {
            background: #f59e0b;
            color: white;
        }
        .btn-complete:hover {
            background: #d97706;
        }
        .btn-copy {
            background: #667eea;
            color: white;
        }
        .btn-copy:hover {
            background: #5a67d8;
        }
        .error-message {
            background: #fed7d7;
            color: #c53030;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #c53030;
        }
        @media (max-width: 768px) {
            .two-columns {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            .back-link {
                top: 20px;
                right: 20px;
            }
            .main-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>✨ Создание объяснения</h1>
        <p>Опишите ситуацию — ИИ сгенерирует письмо</p>
        <a href="/dashboard" class="back-link">← Назад</a>
    </div>

    <div class="main-content">
        <div th:if="${error}" class="error-message" th:text="${error}"></div>

        <div class="two-columns">
            <!-- Левая колонка: форма параметров -->
            <div class="params-form">
                <h3>⚙️ Параметры</h3>
                <form action="/generate" method="post" id="generateForm">
                    <!-- Скрытое поле для ID черновика -->
                    <input type="hidden" name="requestId" th:value="${requestId}">

                    <div class="form-group">
                        <label>👨‍🏫 Кому адресовано</label>
                        <input type="text" name="recipient" th:value="${params != null ? params.recipient : 'Уважаемый преподаватель'}" required>
                    </div>
                    <div class="form-group">
                        <label>📝 Что случилось?</label>
                        <textarea name="eventDescription" rows="3" maxlength="200" required th:text="${params != null ? params.eventDescription : ''}"></textarea>
                    </div>
                    <div class="form-group">
                        <label>🎯 Чего хотите добиться?</label>
                        <textarea name="desiredAction" rows="2" maxlength="150" required th:text="${params != null ? params.desiredAction : ''}"></textarea>
                    </div>
                    <div class="form-group">
                        <label>📊 Степень формальности</label>
                        <select name="formalityLevel">
                            <option th:each="f : ${formalityLevels}"
                                    th:value="${f.code}"
                                    th:text="${f.displayName}"
                                    th:selected="${params != null && params.formalityLevel == f.code}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>⚡ Срочность</label>
                        <select name="urgency">
                            <option th:each="u : ${urgencies}"
                                    th:value="${u.code}"
                                    th:text="${u.displayName}"
                                    th:selected="${params != null && params.urgency == u.code}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>🎭 Тон</label>
                        <select name="tone">
                            <option th:each="t : ${tones}"
                                    th:value="${t.code}"
                                    th:text="${t.displayName}"
                                    th:selected="${params != null && params.tone == t.code}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>📏 Размер объяснения</label>
                        <select name="length">
                            <option th:each="l : ${lengths}"
                                    th:value="${l.code}"
                                    th:text="${l.displayName}"
                                    th:selected="${params != null && params.length == l.code}"></option>
                        </select>
                    </div>
                    <div class="form-group checkbox-group">
                        <input type="checkbox" name="selfIrony" value="true" id="selfIrony"
                               th:checked="${params != null && params.selfIronyAllowed}">
                        <label for="selfIrony">😄 Разрешить самоиронию</label>
                    </div>
                    <div class="form-group">
                        <label>📝 Дополнительные детали</label>
                        <textarea name="customDetails" rows="2" th:text="${params != null ? params.customDetails : ''}"></textarea>
                    </div>
                    <button type="submit" class="generate-btn">🚀 Сгенерировать</button>
                </form>
            </div>

            <!-- Правая колонка: результат -->
            <div class="result-section">
                <h3>🤖 Результат генерации</h3>
                <div class="generated-text" th:utext="${generatedText}">
                    <p class="placeholder">Настройте параметры и нажмите «Сгенерировать»</p>
                </div>
                <div th:if="${generatedText != null}" class="action-buttons">
                    <form action="/save-request" method="post" style="display:inline">
                        <input type="hidden" name="requestId" th:value="${requestId}">
                        <button type="submit" class="btn-save">💾 Сохранить</button>
                    </form>
                    <form action="/complete-request" method="post" style="display:inline">
                        <input type="hidden" name="requestId" th:value="${requestId}">
                        <button type="submit" class="btn-complete">✅ Завершить</button>
                    </form>
                    <button onclick="copyToClipboard()" class="btn-copy">📋 Копировать</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function copyToClipboard() {
        const text = document.querySelector('.generated-text').innerText;
        navigator.clipboard.writeText(text).then(() => alert('✅ Текст скопирован в буфер обмена!'))
                .catch(() => alert('❌ Не удалось скопировать текст'));
    }
</script>
</body>
</html>
