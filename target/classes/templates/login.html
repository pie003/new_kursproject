<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Вход - Сервис объяснений</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .main-content {
            padding: 30px;
        }
        
        /* Картинка-мем */
        .meme-container {
            text-align: center;
            margin-bottom: 25px;
        }
        
        .funny-meme {
            max-width: 100%;
            max-height: 120px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        /* Форма */
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
            font-size: 14px;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        /* Кнопка */
        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        /* Сообщения */
        .error-message {
            background: #fed7d7;
            color: #c53030;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #c53030;
            font-size: 14px;
        }
        
        .success-message {
            background: #c6f6d5;
            color: #276749;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #276749;
            font-size: 14px;
        }
        
        /* Ссылки */
        .register-link {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        
        .register-link p {
            color: #666;
            font-size: 14px;
        }
        
        .register-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }
        
        .register-link a:hover {
            text-decoration: underline;
        }
        
        .back-link {
            display: inline-block;
            margin-top: 15px;
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
        
        /* Дополнительно */
        .demo-note {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #888;
        }
        
        .demo-note a {
            color: #f59e0b;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔐 Вход в аккаунт</h1>
            <p>Войдите, чтобы создавать и сохранять объяснения</p>
        </div>
        
        <div class="main-content">
            
            <!-- Картинка-мем -->
            <div class="meme-container">
                <img src="/images/123.jpg" alt="Мем" class="funny-meme"
                     onerror="this.src='https://placehold.co/400x100/667eea/white?text=🎓'">
            </div>
            
            <!-- Сообщения об ошибках и успехе -->
            <div th:if="${error}" class="error-message" th:text="${error}"></div>
            <div th:if="${success}" class="success-message" th:text="${success}"></div>
            
            <!-- Форма входа -->
            <form action="/login" method="post">
                <div class="form-group">
                    <label>📧 Email</label>
                    <input type="email" name="email" placeholder="student@university.edu" required>
                </div>
                
                <div class="form-group">
                    <label>🔒 Пароль</label>
                    <input type="password" name="password" placeholder="Введите пароль" required>
                </div>
                
                <button type="submit" class="btn-login">Войти</button>
            </form>
            
            <div class="register-link">
                <p>Нет аккаунта? <a href="/register">Зарегистрируйтесь</a></p>
            </div>
            
            <div class="demo-note">
                🎮 <a href="/">Вернуться на главную</a> | 
                <a href="/">Попробовать демо</a>
            </div>
        </div>
    </div>
</body>
</html>
