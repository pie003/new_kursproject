<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Регистрация — Сервис «Почему я не сдал вовремя»</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 550px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 { font-size: 26px; margin-bottom: 8px; }
        .header p { font-size: 14px; opacity: 0.9; }
        .main-content { padding: 30px; }
        .meme-container { text-align: center; margin-bottom: 20px; }
        .funny-meme { max-width: 100%; max-height: 120px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #333; font-size: 14px; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s;
            font-family: inherit;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #48bb78;
            box-shadow: 0 0 0 3px rgba(72, 187, 120, 0.1);
        }
        .form-group small { display: block; margin-top: 5px; font-size: 12px; color: #888; }
        .row-2cols { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn-register {
            width: 100%;
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .btn-register:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(72, 187, 120, 0.4); }
        .error-message { background: #fed7d7; color: #c53030; padding: 12px; border-radius: 10px; margin-bottom: 20px; border-left: 4px solid #c53030; font-size: 14px; }
        .success-message { background: #c6f6d5; color: #276749; padding: 12px; border-radius: 10px; margin-bottom: 20px; border-left: 4px solid #276749; font-size: 14px; }
        .login-link { text-align: center; margin-top: 20px; padding-top: 20px; border-top: 1px solid #eee; }
        .login-link p { color: #666; font-size: 14px; }
        .login-link a { color: #667eea; text-decoration: none; font-weight: bold; }
        .demo-note { text-align: center; margin-top: 20px; font-size: 12px; color: #888; }
        .demo-note a { color: #f59e0b; text-decoration: none; }
        @media (max-width: 550px) { .row-2cols { grid-template-columns: 1fr; gap: 0; } }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📝 Регистрация</h1>
        <p>Создайте аккаунт, чтобы сохранять объяснения</p>
    </div>
    <div class="main-content">
        <div class="meme-container">
            <img src="/images/123.jpg" alt="Мем" class="funny-meme"
                 onerror="this.src='https://placehold.co/400x100/48bb78/white?text=🎓'">
        </div>
        <div th:if="${error}" class="error-message" th:text="${error}"></div>
        <div th:if="${success}" class="success-message" th:text="${success}"></div>

        <form action="/register" method="post">
            <div class="form-group">
                <label>📧 Email</label>
                <input type="email" name="email" placeholder="student@university.edu" required>
            </div>
            <div class="row-2cols">
                <div class="form-group">
                    <label>👤 Имя</label>
                    <input type="text" name="firstName" placeholder="Иван" required>
                </div>
                <div class="form-group">
                    <label>👤 Фамилия</label>
                    <input type="text" name="lastName" placeholder="Иванов" required>
                </div>
            </div>
            <div class="form-group">
                <label>📚 Группа</label>
                <input type="text" name="group" placeholder="ИВТ-31" required>
            </div>
            <div class="form-group">
                <label>👤 Пол</label>
                <select name="gender" required>
                    <option value="MALE">Мужской</option>
                    <option value="FEMALE">Женский</option>
                    <option value="OTHER">Другой</option>
                </select>
                <small>Для корректного обращения в письмах</small>
            </div>
            <div class="form-group">
                <label>🔒 Пароль</label>
                <input type="password" name="password" placeholder="Минимум 6 символов" required>
            </div>
            <div class="form-group">
                <label>🔑 Подтверждение пароля</label>
                <input type="password" name="confirmPassword" placeholder="Повторите пароль" required>
            </div>
            <button type="submit" class="btn-register">Зарегистрироваться</button>
        </form>

        <div class="login-link">
            <p>Уже есть аккаунт? <a href="/login">Войдите</a></p>
        </div>
        <div class="demo-note">
            🎮 <a href="/">Вернуться на главную</a> |
            <a href="/">Попробовать демо</a>
        </div>
    </div>
</div>
</body>
</html>
