<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Создание объяснения - Сервис «Почему я не сдал вовремя»</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        /* Шапка */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px 30px;
            position: relative;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .back-link {
            position: absolute;
            top: 25px;
            right: 30px;
            color: white;
            text-decoration: none;
            background: rgba(255,255,255,0.2);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .back-link:hover {
            background: rgba(255,255,255,0.3);
        }
        
        /* Основное содержание */
        .main-content {
            padding: 30px;
        }
        
        /* Две колонки */
        .two-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        
        /* Форма параметров */
        .params-form {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
        }
        
        .params-form h3 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .form-group {
            margin-bottom: 18px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
            font-size: 14px;
        }
        
        .form-group select,
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
            font-family: inherit;
        }
        
        .form-group select:focus,
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        /* Чекбокс */
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .checkbox-group input {
            width: auto;
        }
        
        .checkbox-group label {
            margin-bottom: 0;
        }
        
        /* Кнопка генерации */
        .generate-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        
        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        /* Результат генерации */
        .result-section {
            background: #f0f4ff;
            padding: 25px;
            border-radius: 15px;
        }
        
        .result-section h3 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .generated-text {
            background: white;
            padding: 20px;
            border-radius: 10px;
            min-height: 400px;
            border-left: 4px solid #667eea;
            line-height: 1.6;
        }
        
        .placeholder {
            color: #999;
            text-align: center;
            padding: 60px 20px;
        }
        
        /* Сообщения об ошибках */
        .error-message {
            background: #fed7d7;
            color: #c53030;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #c53030;
        }
        
        /* Адаптивность */
        @media (max-width: 768px) {
            .two-columns {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .header h1 {
                font-size: 20px;
                padding-right: 80px;
            }
            
            .back-link {
                top: 20px;
                right: 20px;
            }
            
            .main-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✨ Создание объяснения</h1>
            <p>Выберите параметры ситуации, и ИИ сгенерирует идеальный текст</p>
            <a href="/dashboard" class="back-link">← Назад</a>
        </div>
        
        <div class="main-content">
            <!-- Сообщение об ошибке -->
            <div th:if="${error}" class="error-message" th:text="${error}"></div>
            
            <div class="two-columns">
                <!-- Левая колонка: форма параметров -->
                <div class="params-form">
                    <h3>
                        <span>⚙️</span>
                        Настройки генерации
                    </h3>
                    
                    <form action="/generate" method="post" id="generateForm">
                        <!-- Тип события -->
                        <div class="form-group">
                            <label>📌 Тип события</label>
                            <select name="eventType" required>
                                <option value="MISSED_DEADLINE">Пропуск дедлайна</option>
                                <option value="TECHNICAL_ISSUE">Технические проблемы</option>
                                <option value="HEALTH_ISSUES">Проблемы со здоровьем</option>
                                <option value="FAMILY_REASONS">Семейные обстоятельства</option>
                                <option value="WORK_OVERLOAD">Перегрузка на работе</option>
                                <option value="LOST_FILES">Потеря файлов</option>
                                <option value="OTHER">Другое</option>
                            </select>
                        </div>
                        
                        <!-- Адресат -->
                        <div class="form-group">
                            <label>👤 Адресат</label>
                            <input type="text" name="recipient" value="Уважаемый преподаватель" required>
                        </div>
                        
                        <!-- Степень формальности -->
                        <div class="form-group">
                            <label>📊 Степень формальности</label>
                            <select name="formalityLevel" required>
                                <option value="INFORMAL">Неформальный</option>
                                <option value="MEDIUM" selected>Средний</option>
                                <option value="FORMAL">Официальный</option>
                                <option value="VERY_FORMAL">Максимально официальный</option>
                            </select>
                        </div>
                        
                        <!-- Срочность -->
                        <div class="form-group">
                            <label>⚡ Срочность</label>
                            <select name="urgency" required>
                                <option value="LOW">Низкая</option>
                                <option value="MEDIUM" selected>Средняя</option>
                                <option value="HIGH">Высокая</option>
                                <option value="CRITICAL">Критическая</option>
                            </select>
                        </div>
                        
                        <!-- Тон -->
                        <div class="form-group">
                            <label>🎭 Тон</label>
                            <select name="tone" required>
                                <option value="NEUTRAL">Нейтральный</option>
                                <option value="APOLOGETIC">Извиняющийся</option>
                                <option value="CONSTRUCTIVE">Конструктивный</option>
                                <option value="HUMOROUS">С юмором</option>
                                <option value="PROFESSIONAL">Профессиональный</option>
                            </select>
                        </div>
                        
                        <!-- Самоирония -->
                        <div class="form-group checkbox-group">
                            <input type="checkbox" name="selfIrony" value="true" id="selfIrony">
                            <label for="selfIrony">😄 Разрешить самоиронию</label>
                        </div>
                        
                        <!-- Дополнительные детали -->
                        <div class="form-group">
                            <label>📝 Дополнительные детали</label>
                            <textarea name="customDetails" placeholder="Опишите ситуацию подробнее..."></textarea>
                        </div>
                        
                        <button type="submit" class="generate-btn">
                            🚀 Сгенерировать объяснение
                        </button>
                    </form>
                </div>
                
                <!-- Правая колонка: результат -->
                <div class="result-section">
                    <h3>
                        <span>🤖</span>
                        Результат генерации
                    </h3>
                    <div class="generated-text" th:utext="${generatedText}">
                        <p class="placeholder">
                            ✨ Настройте параметры и нажмите «Сгенерировать»<br>
                            Искусственный интеллект создаст идеальное объяснение
                        </p>
                    </div>
                    <div th:if="${generatedText != null}" style="margin-top: 15px; text-align: center;">
                        <button onclick="copyToClipboard()" style="background: #48bb78; color: white; border: none; padding: 8px 20px; border-radius: 20px; cursor: pointer; margin-right: 10px;">
                            📋 Копировать текст
                        </button>
                        <button onclick="window.location.reload()" style="background: #f59e0b; color: white; border: none; padding: 8px 20px; border-radius: 20px; cursor: pointer;">
                            🔄 Новый запрос
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function copyToClipboard() {
            const textElement = document.querySelector('.generated-text');
            const text = textElement.innerText;
            
            navigator.clipboard.writeText(text).then(() => {
                alert('✅ Текст скопирован в буфер обмена!');
            }).catch(() => {
                alert('❌ Не удалось скопировать текст');
            });
        }
    </script>
</body>
</html>
